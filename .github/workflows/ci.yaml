name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref; also serializes pushes so the
# cache-warming deps job never races another instance of itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single writer for the uv cache: parallel jobs with an identical
  # lockfile hash would otherwise race to reserve the same key, which
  # has been observed to wedge workflow runs in "in progress" forever
  # even when every job passes. Downstream jobs only ever read the
  # cache, which does not contend.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv sync --extra dev

  lint:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # tags drive the version baked into the extension
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: make setup

      - name: Build extension (needed for ty to resolve the native module)
        run: make build

      - name: Lint
        run: make lint

  test:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: make setup

      - name: Build extension
        run: make build

      - name: Test
        run: make test

      # Smoke-run the benchmarks so they can't silently stop compiling or
      # panic; real perf comparisons happen locally via `make bench`.
      - name: Bench (smoke)
        run: cargo bench -- --test
