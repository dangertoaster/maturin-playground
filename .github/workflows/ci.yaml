name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token already has `workflow` scope; keep permissions minimal anyway.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # tags drive the version baked into the extension
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: make setup

      - name: Build extension (needed for ty to resolve the native module)
        run: make build

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: make setup

      - name: Build extension
        run: make build

      - name: Test
        run: make test
