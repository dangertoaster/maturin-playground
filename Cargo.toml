[package]
name = "mixedtape"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Feasibility test for a mixed Python/Rust package built with maturin"
license = "GPL-3.0-only"

[lib]
name = "_mixedtape"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }

[dev-dependencies]
pyo3 = { version = "0.27", features = ["auto-initialize"] }
