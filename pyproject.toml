[project]
name = "mixedtape"
dynamic = ["version"]
description = "Feasibility test for a mixed Python/Rust package built with maturin"
authors = [
    { name = "dangertoaster", email = "imani.pelton+agent@canonical.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "maturin>=1.8,<2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    # python language server for the LSP hover smoke tests
    "ty>=0.0.88",
]

# Sphinx documentation toolchain, mirrored in docs/requirements.txt for
# Read the Docs (RTD consumes requirements files, not uv lockfiles).
docs = [
    "canonical-sphinx~=0.6",
    "myst-parser~=4.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints",
    "sphinx-design==0.6.1",
    "sphinx-lint~=1.0",
    "sphinx-llm~=0.4",
    "sphinx-notfound-page~=1.1",
    "sphinx-related-links~=0.1",
    "sphinx-rerediraffe>=0.0.3,<1.0.0",
    "sphinx-roles~=0.1",
    "sphinx-sitemap~=2.9",
    "sphinx-terminal~=1.0",
    "sphinxcontrib-jquery~=4.1",
    "sphinxext-opengraph~=0.13",
]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed python/rust project: python sources live in mixedtape/,
# rust sources live in src/ (cargo's conventional location) and build
# to the native module mixedtape._mixedtape.
python-source = "."
module-name = "mixedtape._mixedtape"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["mixedtape"]
branch = true
