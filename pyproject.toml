[project]
name = "mixedtape"
dynamic = ["version"]
description = "Feasibility test for a mixed Python/Rust package built with maturin"
authors = [
    { name = "dangertoaster", email = "imani.pelton+agent@canonical.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed python/rust project: python sources live in src/mixedtape,
# the rust extension builds to mixedtape._mixedtape.
python-source = "src"
module-name = "mixedtape._mixedtape"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/mixedtape"]
branch = true
